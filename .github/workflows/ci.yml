name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: relay/pnpm-lock.yaml
      - name: install
        working-directory: relay
        run: pnpm install --frozen-lockfile
      - name: typecheck
        working-directory: relay
        run: pnpm typecheck
      - name: test
        working-directory: relay
        run: pnpm test
      - name: build
        working-directory: relay
        run: pnpm build
      - name: leak grep
        run: .github/scripts/leak-grep.sh .

  setup-sh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck
        run: shellcheck -s sh site/public/setup.sh site/test/setup/run.sh site/test/setup/stubs/*
      - name: harness
        run: sh site/test/setup/run.sh

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: test
        working-directory: site
        run: npm test
      - name: leak grep
        run: .github/scripts/leak-grep.sh site

  firmware-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: host tests
        run: firmware/scripts/test-host.sh
